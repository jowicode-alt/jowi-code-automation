name: Process one private draft

on:
  workflow_dispatch:
    inputs:
      confirm_private_upload:
        description: "Type PRIVATE to allow one queued job to be uploaded privately to YouTube"
        required: true
        type: string
      job_category:
        description: "Choose which queued job type to process"
        required: true
        type: choice
        options:
          - all
          - breaking_news
        default: all
      retry_blocked_job_id:
        description: "Optional: re-queue a specific blocked test or breaking-news job"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: jowi-private-worker
  cancel-in-progress: false

jobs:
  process-one:
    if: ${{ inputs.confirm_private_upload == 'PRIVATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.JOWI_DATABASE_URL }}
      AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_VOICE: en-US-GuyNeural
      TTS_RATE: -5%
      TTS_PITCH: -8Hz
      JOB_CATEGORY_INPUT: ${{ inputs.job_category }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets before processing
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret for ${name} is missing. No job was processed."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements.txt

      - name: Re-queue the specific blocked test job if requested
        if: ${{ inputs.retry_blocked_job_id != '' }}
        env:
          RETRY_BLOCKED_JOB_ID: ${{ inputs.retry_blocked_job_id }}
        run: |
          python - <<'PY'
          import os
          from app.jobs import get_job, update_job_status

          job_id = os.environ["RETRY_BLOCKED_JOB_ID"].strip()
          job = get_job(job_id)
          if job is None:
              raise SystemExit("Refusing to re-queue: job was not found in the configured database.")
          if job["status"] not in {"blocked", "failed"}:
              raise SystemExit(
                  "Refusing to re-queue: expected status 'blocked' or 'failed', "
                  f"found {job['status']!r}."
              )
          category = os.environ.get("JOB_CATEGORY_INPUT", "all")
          job_type = job.get("job_type", "")
          is_known_test_job = job_id == "4679ab92-9fcb-45f7-8aa2-0e5ccebe00b2"
          is_selected_news_job = category == "breaking_news" and job_type == "breaking_news"
          if not (is_known_test_job or is_selected_news_job):
              raise SystemExit(
                  "Refusing to re-queue: only the known test job or a breaking-news job "
                  "when breaking_news is selected may be retried."
              )
          updated = update_job_status(job_id, "queued", error=None)
          if not updated or updated["status"] != "queued":
              raise SystemExit("Re-queue could not be verified.")
          print(f"Re-queued existing {job_type or 'test'} job {job_id} without creating a duplicate.")
          PY

      - name: Select the queued job category
        shell: bash
        run: |
          if [[ "$JOB_CATEGORY_INPUT" == "breaking_news" ]]; then
            echo "JOB_CATEGORY_FILTER=breaking_news" >> "$GITHUB_ENV"
            echo "This run will process only a breaking-news candidate."
          else
            echo "This run may process any queued job."
          fi

      - name: Process queued job
        run: python -m app.worker
