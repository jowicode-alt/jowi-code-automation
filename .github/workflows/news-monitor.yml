name: Monitor international breaking news

on:
  schedule:
    # 30-minute polling balances freshness with GitHub Actions free-tier usage.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jowi-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.JOWI_DATABASE_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate dedicated durable database
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::JOWI_DATABASE_URL is missing. No monitoring state or job was written."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Poll feeds, corroborate headlines, and queue candidates
        run: python -m app.news_monitor

      # Intentionally no YouTube upload, public publishing, or artifact upload here.
      # The worker remains a separate private-draft operation during validation.
