name: Daily private content automation

on:
  schedule:
    # Uganda is UTC+3: comedy 12:30, AI/technology 15:00, entertainment 18:00 EAT.
    - cron: "30 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  push:
    paths:
      - ".github/video-test-trigger"
  workflow_dispatch:
    inputs:
      category:
        description: "Content type to create as one private YouTube draft"
        required: true
        type: choice
        options:
          - comedy
          - ai_technology
          - entertainment
        default: comedy

permissions:
  contents: read

concurrency:
  group: jowi-daily-private-content
  cancel-in-progress: false

jobs:
  create-private-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.JOWI_DATABASE_URL }}
      AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_VOICE: en-US-GuyNeural
      TTS_RATE: -5%
      TTS_PITCH: -8Hz
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      MANUAL_CATEGORY: ${{ inputs.category || '' }}
      PUSH_TEST_MODE: ${{ github.event_name == 'push' && 'true' || 'false' }}
      ALLOW_EXTRA_REGULAR_JOBS: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret for ${name} is missing. No job was processed."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements.txt

      - name: Queue one original category idea and render privately
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PUSH_TEST_MODE:-false}" == "true" ]]; then
            CATEGORY="$(tr -d '[:space:]' < ../.github/video-test-trigger)"
            case "$CATEGORY" in
              comedy|ai_technology|entertainment) ;;
              *) echo "::error::Invalid private video test category in .github/video-test-trigger."; exit 1 ;;
            esac
          else
          case "${MANUAL_CATEGORY:-}" in
            comedy|ai_technology|entertainment) CATEGORY="$MANUAL_CATEGORY" ;;
            "")
              case "$EVENT_SCHEDULE" in
                "30 9 * * *") CATEGORY="comedy" ;;
                "0 12 * * *") CATEGORY="ai_technology" ;;
                "0 15 * * *") CATEGORY="entertainment" ;;
                *) echo "::error::Could not identify the scheduled category."; exit 1 ;;
              esac
              ;;
            *) echo "::error::Unsupported category."; exit 1 ;;
          esac
          fi
          export CATEGORY
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from app.jobs import enqueue_job, list_jobs

          category = os.environ["CATEGORY"]
          topics = {
              "comedy": [
                  "When you say you will leave in five minutes",
                  "The friend who turns a simple plan into a mission",
                  "Trying to save money while your cravings disagree",
                  "When the group chat makes the decision harder",
                  "The confidence of someone who did not read the instructions",
                  "When your alarm clock becomes your biggest enemy",
                  "The person who says they are almost there but has not left",
              ],
              "ai_technology": [
                  "Three practical ways to use AI to organize a busy day",
                  "How to fact-check an AI answer before trusting it",
                  "A simple AI workflow for turning notes into an action plan",
                  "How to write a clearer prompt for a useful AI result",
                  "What AI can and cannot do reliably for everyday tasks",
                  "How to compare AI tools without falling for hype",
                  "A safer way to use AI when handling personal information",
              ],
              "entertainment": [
                  "Why short-form trends spread so quickly",
                  "How internet challenges turn into global conversations",
                  "The difference between a viral moment and a lasting trend",
                  "Why audiences love unexpected plot twists",
                  "How creators make a familiar format feel original",
                  "What makes an online moment memorable",
                  "Why entertainment trends change so fast",
              ],
          }

          now = datetime.now(timezone.utc)
          day_start = now.replace(hour=0, minute=0, second=0, microsecond=0)
          jobs = list_jobs(100)
          force_test = os.getenv("PUSH_TEST_MODE", "").lower() == "true"
          active = [
              job for job in jobs
              if job.get("job_type") == category
              and job.get("status") in {"queued", "running"}
          ]

          if active and not force_test:
              print(f"Reusing existing {category} job {active[0]['id']}: {active[0]['topic']}")
          else:
              todays_regular = []
              for job in jobs:
                  created = job.get("created_at_utc")
                  if job.get("job_type") == "breaking_news" or not created:
                      continue
                  created_at = datetime.fromisoformat(created.replace("Z", "+00:00"))
                  if created_at >= day_start:
                      todays_regular.append(job)

              todays_category = [
                  job for job in todays_regular
                  if job.get("job_type") == category
              ]

              if force_test:
                  topic_index = (now.hour * 60 + now.minute + now.second) % len(topics[category])
                  topic = topics[category][topic_index]
                  job = enqueue_job(category, topic)
                  print(f"FORCED PRIVATE TEST: queued fresh {category} job {job['id']}: {job['topic']}")
              elif todays_category:
                  print(
                      f"SKIP_PRIVATE_WORKER=true: {category} already has a job today "
                      f"({todays_category[0]['status']}); preventing a duplicate daily upload."
                  )
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("SKIP_PRIVATE_WORKER=true\n")
              elif len(todays_regular) >= 3:
                  print(
                      "SKIP_PRIVATE_WORKER=true: the three-job UTC daily limit is already used; "
                      "skipping safely without failing the workflow or uploading a duplicate."
                  )
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("SKIP_PRIVATE_WORKER=true\n")
              else:
                  topic = topics[category][now.date().toordinal() % len(topics[category])]
                  job = enqueue_job(category, topic)
                  print(f"Queued {category} job {job['id']}: {job['topic']}")
          PY
          echo "JOB_CATEGORY_FILTER=$CATEGORY" >> "$GITHUB_ENV"

      - name: Install and run private one-job worker
        if: env.SKIP_PRIVATE_WORKER != 'true'
        run: python -m app.worker

      # All uploads use the private-only YouTube uploader. Nothing is published publicly.
      # This workflow creates no artifacts to conserve free-tier storage.
