services:
  - type: web
    name: jowi-code-automation
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: API_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_HORDE_MODEL
        value: AlbedoBase XL (SDXL)
      - key: TTS_VOICE
        value: en-US-GuyNeural
      - key: TTS_RATE
        value: -5%
      - key: TTS_PITCH
        value: -8Hz
